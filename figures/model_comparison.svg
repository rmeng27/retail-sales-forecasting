<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#1f2937}
  .title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#6b7280}.label{font-size:16px}.value{font-size:15px;font-weight:600}
  .grid{stroke:#e5e7eb;stroke-width:1}.axis{stroke:#9ca3af;stroke-width:1}
</style>
<rect width="1100" height="560" fill="white"/>
<text x="60" y="48" class="title">36-Month Holdout Forecast Accuracy</text>
<text x="60" y="76" class="sub">Mean Absolute Percentage Error (MAPE) - lower is better</text>
<line x1="340" y1="110" x2="340" y2="500" class="axis"/>
<line x1="340" y1="500" x2="1020" y2="500" class="axis"/>
<g class="grid">
<line x1="453" y1="110" x2="453" y2="500"/><line x1="566" y1="110" x2="566" y2="500"/>
<line x1="679" y1="110" x2="679" y2="500"/><line x1="792" y1="110" x2="792" y2="500"/>
<line x1="905" y1="110" x2="905" y2="500"/><line x1="1018" y1="110" x2="1018" y2="500"/>
</g>
<g class="sub">
<text x="336" y="525">0%</text><text x="448" y="525">1%</text><text x="561" y="525">2%</text>
<text x="674" y="525">3%</text><text x="787" y="525">4%</text><text x="900" y="525">5%</text><text x="1013" y="525">6%</text>
</g>
<text x="60" y="145" class="label">Random Walk with Drift</text><rect x="340" y="125" width="160" height="28" rx="5" fill="#2563eb"/><text x="510" y="145" class="value">1.414%</text>
<text x="60" y="205" class="label">ETS</text><rect x="340" y="185" width="177" height="28" rx="5" fill="#60a5fa"/><text x="527" y="205" class="value">1.569%</text>
<text x="60" y="265" class="label">ARIMA(0,1,2) + drift</text><rect x="340" y="245" width="214" height="28" rx="5" fill="#93c5fd"/><text x="564" y="265" class="value">1.889%</text>
<text x="60" y="325" class="label">Auto ARIMA</text><rect x="340" y="305" width="214" height="28" rx="5" fill="#93c5fd"/><text x="564" y="325" class="value">1.889%</text>
<text x="60" y="385" class="label">NNAR</text><rect x="340" y="365" width="534" height="28" rx="5" fill="#c4b5fd"/><text x="884" y="385" class="value">4.720%</text>
<text x="60" y="445" class="label">Naive</text><rect x="340" y="425" width="647" height="28" rx="5" fill="#d1d5db"/><text x="997" y="445" class="value">5.721%</text>
<text x="60" y="548" class="sub">Best model: Random Walk with Drift - RMSE 11,524.63 - MAPE 1.414%</text>
</svg>